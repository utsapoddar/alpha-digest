# Data source configuration for Alpha Digest
# Each source maps to a fetcher module in digest/fetchers/
# To add a new source: create a fetcher in digest/fetchers/, then add it here.

fetchers:
  large_insiders:
    enabled: true
    description: "SEC Form 4 trades of US$1 million+; aggregator reference links only"
    min_value_usd: 1000000
    max_filings: 200

  sec_edgar:
    enabled: true
    description: "SEC EDGAR Form 4 + 13F filings"

  news:
    enabled: true
    description: "Google News RSS headlines per entity"

  crypto:
    enabled: true
    description: "CoinGecko corporate crypto treasury tracker"

  commodities:
    enabled: true
    description: "Yahoo Finance weekly commodity price changes"

  feeds:
    enabled: true
    description: "Custom RSS feeds from config/feeds.csv"

# Commodity symbols tracked (fetcher: commodities)
commodities:
  Gold: "GC=F"
  "Oil (WTI)": "CL=F"
  Silver: "SI=F"
